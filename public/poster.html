<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>生成分享海报 · 奇门遁甲</title>
<script src="https://cdn.bootcdn.net/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#0a1310;
  background-image:radial-gradient(circle at 50% 0%, #142b22 0%, #0a1310 60%);
  min-height:100vh;
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  padding:0 0 40px;
  color:#e0e6e3;
}

/* 顶部导航栏 */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;
  position:sticky;top:0;
  background:rgba(10,19,16,0.85);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  z-index:10;
}
.btn-back{
  display:flex;align-items:center;gap:4px;
  color:#d4af37;font-size:14px;letter-spacing:1px;
  padding:6px 12px;
  border:1px solid rgba(212,175,55,0.4);
  border-radius:6px;
  background:rgba(212,175,55,0.08);
  cursor:pointer;
  text-decoration:none;
}
.btn-back:active{background:rgba(212,175,55,0.25);}
.topbar-title{
  color:#f2d77f;font-size:16px;letter-spacing:4px;
  font-weight:700;
  text-shadow:0 0 12px rgba(212,175,55,0.4);
}
.topbar-placeholder{width:80px;}

/* 提示 */
.tip{text-align:center;color:#d4af37;font-size:13px;margin:16px 0 6px;letter-spacing:2px;}
.tip-sub{color:#8a9b94;font-size:11px;margin-bottom:20px;letter-spacing:1px;text-align:center;}

/* 海报 */
.poster-wrap{
  width:340px;margin:0 auto;
  border-radius:16px;
  box-shadow:
    0 0 40px rgba(212,175,55,0.35),
    0 20px 60px rgba(0,0,0,0.7);
  overflow:hidden;
  position:relative;
}
.poster{
  width:340px;
  background:#0b1310;
  background-image:radial-gradient(circle at 50% 0%, #1a3829 0%, #0b1310 70%);
  position:relative;
  padding:26px 22px 24px;
  color:#e0e6e3;
}
.poster::before{
  content:"";position:absolute;inset:10px;
  border:1px solid rgba(212,175,55,0.35);
  border-radius:8px;pointer-events:none;
}
.poster::after{
  content:"";position:absolute;inset:14px;
  border:1px solid rgba(212,175,55,0.12);
  border-radius:6px;pointer-events:none;
}
.poster-top-tag{
  text-align:center;color:#d4af37;font-size:10px;
  letter-spacing:6px;margin-bottom:16px;opacity:0.9;
  padding-left:6px;
}
.poster-top-tag::before,.poster-top-tag::after{content:"·";margin:0 8px;opacity:0.5;}
.poster-avatar{
  width:150px;height:150px;margin:0 auto 18px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid rgba(212,175,55,0.5);
  box-shadow:0 0 30px rgba(212,175,55,0.3),inset 0 0 20px rgba(0,0,0,0.6);
  position:relative;
}
.poster-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.poster-avatar::after{
  content:"";position:absolute;inset:6px;
  border:1px solid rgba(212,175,55,0.3);
  border-radius:50%;pointer-events:none;
}
.poster-h1{
  text-align:center;color:#f2d77f;
  font-size:24px;font-weight:700;
  letter-spacing:3px;line-height:1.4;
  text-shadow:0 0 20px rgba(212,175,55,0.5);
  margin-bottom:14px;
}
.poster-h1 .line2{display:block;}
.poster-divider{
  width:60px;height:1px;margin:0 auto 16px;
  background:linear-gradient(90deg,transparent,#d4af37,transparent);
  position:relative;
}
.poster-divider::before,.poster-divider::after{
  content:"◆";color:#d4af37;font-size:6px;
  position:absolute;top:50%;transform:translateY(-50%);opacity:0.7;
}
.poster-divider::before{left:-10px;}
.poster-divider::after{right:-10px;}
.poster-sub{
  text-align:center;color:#c8d6cd;
  font-size:12.5px;line-height:1.9;
  letter-spacing:0.5px;
  padding:0 4px;margin-bottom:18px;
}
.poster-sub strong{color:#f2d77f;}
.poster-tian{text-align:center;margin-bottom:20px;}
.poster-tian .big{
  color:#d4af37;font-size:18px;letter-spacing:6px;
  font-weight:700;
  text-shadow:0 0 14px rgba(212,175,55,0.5);
}
.poster-tian .small{display:block;color:#8a9b94;font-size:10px;letter-spacing:4px;margin-top:4px;}
.poster-bottom{
  background:rgba(20,34,28,0.7);
  border:1px solid rgba(212,175,55,0.25);
  border-radius:10px;
  padding:14px 16px;
  display:flex;align-items:center;gap:12px;
  position:relative;
}
.poster-qr{
  width:76px;height:76px;flex-shrink:0;
  background:#fff;border-radius:6px;
  padding:4px;
  box-shadow:0 0 15px rgba(212,175,55,0.3);
}
.poster-qr img{width:100%;height:100%;display:block;}
.poster-qr-text{flex:1;min-width:0;}
.poster-qr-text .t1{color:#f2d77f;font-size:13px;font-weight:700;letter-spacing:2px;margin-bottom:6px;}
.poster-qr-text .t2{color:#8a9b94;font-size:10.5px;line-height:1.6;letter-spacing:0.5px;}
.poster-qr-text .t2 strong{color:#d4af37;}
.poster-footer{text-align:center;margin-top:14px;font-size:9px;color:#5a6b62;letter-spacing:2px;}

/* 保存按钮（不悬浮） */
.save-btn{
  display:block;
  width:340px;
  margin:20px auto 0;
  background:linear-gradient(180deg,#d4af37 0%,#b38f2b 100%);
  color:#0b1310;border:none;
  padding:16px 20px;border-radius:30px;
  font-size:15px;font-weight:bold;letter-spacing:1.5px;
  font-family:"Noto Serif SC",serif;
  box-shadow:0 6px 20px rgba(212,175,55,0.4);
  cursor:pointer;
}
.save-btn:active{transform:scale(0.97);}
.save-btn:disabled{opacity:0.6;}
</style>
</head>
<body>

<div class="topbar">
  <a class="btn-back" onclick="history.length>1?history.back():location.href='/qimen.html'">← 返回</a>
  <div class="topbar-title">分享海报</div>
  <div class="topbar-placeholder"></div>
</div>

<div class="tip">📸 长按图片保存，或点下方按钮</div>
<div class="tip-sub">保存后发朋友圈 / 发给好友</div>

<div class="poster-wrap">
  <div class="poster" id="poster">
    <div class="poster-top-tag">奇门遁甲</div>
    <div class="poster-avatar">
      <img src="/share-cover.jpg" alt="玄女" crossorigin="anonymous">
    </div>
    <div class="poster-h1">
      这人合不合？<span class="line2">这事成不成？</span>
    </div>
    <div class="poster-divider"></div>
    <div class="poster-sub">
      为什么大佬跟人合作或做事前，<br>
      都会先用这个<strong>起局预测</strong>？
    </div>
    <div class="poster-tian">
      <div class="big">天垂象，见吉凶</div>
      <div class="small">起 一 局 · 心 里 就 有 数</div>
    </div>
    <div class="poster-bottom">
      <div class="poster-qr">
        <img id="qr-img" src="/api/qrcode?text=https%3A%2F%2Fqimendun.netlify.app%2F" alt="二维码">
      </div>
      <div class="poster-qr-text">
        <div class="t1">长按扫码 · 起一局</div>
        <div class="t2">扫码进入，<strong>立即起局</strong><br>问人、问事、问前程</div>
      </div>
    </div>
    <div class="poster-footer">传统文化学习娱乐 · 不构成任何建议</div>
  </div>
</div>

<button class="save-btn" id="saveBtn" onclick="savePoster()">保存海报 · 分享赚佣金</button>

<script>
function savePoster(){
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = '生成中...';

  html2canvas(document.getElementById('poster'), {
    scale: 3,
    useCORS: true,
    allowTaint: false,
    backgroundColor: '#0b1310',
    logging: false
  }).then(canvas => {
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '奇门遁甲海报_' + Date.now() + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      btn.disabled = false;
      btn.textContent = '保存海报 · 分享赚佣金';
      alert('✅ 已保存\n\n如果没有自动保存：\n1. 长按上方海报图片\n2. 选择"保存图片"');
    }, 'image/png', 1.0);
  }).catch(err => {
    console.error(err);
    btn.disabled = false;
    btn.textContent = '保存海报 · 分享赚佣金';
    alert('生成失败：请直接长按海报图片 → 保存图片');
  });
}
</script>


<script>
// 分享二维码防缓存：加载时追加时间戳参数
(function () {
  var img = document.getElementById('qr-img');
  if (img) { img.src = '/api/qrcode?text=' + encodeURIComponent(location.origin + '/') + '&v=' + Date.now(); }
})();
</script>
</body>
</html>
