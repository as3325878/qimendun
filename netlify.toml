# Netlify 部署配置（免费，GitHub 登录即可，无需手机验证）
[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# /api/* 请求转发给 serverless 函数（Express 处理）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200

# 其余未命中静态文件的路径兜底到首页（静态页由 CDN 直接服务）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
